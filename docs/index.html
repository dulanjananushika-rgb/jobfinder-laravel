<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="JobFinder Sri Lanka job portal">
  <title>JobFinder — Sri Lanka Job Portal</title>
  <style>
    :root{--ink:#101318;--paper:#fff;--bg:#f4f6f9;--line:#dfe5ed;--muted:#6d7685;--blue:#246fe5;--blue2:#155ac2;--green:#0b8f62;--mint:#e5f7ef;--violet:#f1ecfa;--peach:#fff1dc;--red:#d64b4b;--shadow:0 16px 45px rgba(25,38,60,.10)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#20252d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}a{color:inherit;text-decoration:none}
    .top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}.nav{max-width:1240px;margin:auto;min-height:70px;padding:0 28px;display:flex;align-items:center;gap:22px}.brand{margin-right:auto;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;cursor:pointer}.mark{width:39px;height:31px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#2688ff,#67d9ff);box-shadow:0 8px 24px #2678ff55;font-size:14px}.nav button{border:0;background:none;color:#dbe2ed;cursor:pointer}.nav button:hover{color:#fff}.nav .pill{padding:10px 16px;border-radius:999px;background:var(--blue);color:#fff;font-weight:800}.menu{display:flex;align-items:center;gap:18px}.mobile{display:none}
    .hero{background:var(--ink);color:#fff;padding:58px 28px 62px}.hero-inner{max-width:1184px;margin:auto}.hero h1{font-size:clamp(38px,6vw,66px);line-height:1.02;letter-spacing:-2px;max-width:820px;margin:0 0 18px}.hero p{color:#b9c2d1;font-size:18px;margin:0 0 28px}.search{display:grid;grid-template-columns:1.3fr 1fr auto;gap:0;background:#fff;border:6px solid #ffffff17;border-radius:999px;padding:6px;max-width:950px}.search input,.search select{border:0;min-height:52px;padding:0 18px;outline:none;background:#fff}.search input{border-radius:999px 0 0 999px;border-right:1px solid var(--line)}
    .btn{border:1px solid var(--blue);background:var(--blue);color:#fff;min-height:42px;padding:0 18px;border-radius:999px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{background:var(--blue2)}.btn.secondary{background:#fff;color:#222;border-color:var(--line)}.btn.ghost{background:transparent;color:var(--blue);border-color:transparent;padding:0}.btn.danger{background:var(--red);border-color:var(--red)}.search .btn{min-width:130px}
    main{max-width:1240px;margin:auto;padding:34px 28px 60px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:17px}.section-head h2,h2{margin:0 0 7px;font-size:27px}.muted{color:var(--muted)}.grid{display:grid;gap:18px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 0 rgba(25,40,65,.03)}.stat strong{font-size:29px;display:block;margin-bottom:4px}.job{min-height:250px;display:flex;flex-direction:column;gap:11px;transition:.2s}.job:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.job-head{display:flex;gap:12px;align-items:flex-start}.logo{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:#eaf2ff;color:var(--blue);font-weight:900}.job h3{margin:0;font-size:18px}.job .company{font-size:13px;color:var(--muted)}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{padding:5px 9px;border-radius:999px;background:var(--violet);color:#65409b;font-size:12px;font-weight:800}.tag.green{background:var(--mint);color:var(--green)}.tag.peach{background:var(--peach);color:#9a5d0d}.job .actions{margin-top:auto;display:flex;gap:8px}.price{font-weight:900}.chips{display:flex;flex-wrap:wrap;gap:9px;margin:8px 0 26px}.chip{padding:8px 12px;border:1px solid #cfe0f9;background:#eaf3ff;color:#1b5caf;border-radius:999px;cursor:pointer;font-weight:750}
    .panel{display:grid;grid-template-columns:240px 1fr;gap:20px}.side{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;height:max-content}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:9px;cursor:pointer}.side button.active,.side button:hover{background:#eaf3ff;color:#1357b2;font-weight:800}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.status{padding:5px 8px;border-radius:999px;background:var(--mint);color:var(--green);font-size:12px;font-weight:800}.status.pending{background:var(--peach);color:#93590d}
    .form{display:grid;gap:14px}.form label{font-weight:800;font-size:13px}.form input,.form select,.form textarea{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.form textarea{min-height:125px}.auth{max-width:760px;margin:30px auto}.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.role{border:1px solid var(--line);border-radius:13px;background:#fff;padding:20px;text-align:left;cursor:pointer}.role:hover{border-color:#7aaafa;box-shadow:var(--shadow)}.role b{display:block;margin-bottom:6px}.toast{position:fixed;right:24px;bottom:24px;background:#111;color:#fff;padding:14px 18px;border-radius:11px;box-shadow:var(--shadow);z-index:50;opacity:0;transform:translateY(15px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:none}.empty{text-align:center;padding:48px 20px;color:var(--muted)}.footer{background:#fff;border-top:1px solid var(--line);padding:24px 28px}.footer-inner{max-width:1184px;margin:auto;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;color:var(--muted)}
    @media(max-width:900px){.menu{display:none}.mobile{display:block}.hero{padding-top:40px}.search,.panel,.g2,.g3,.g4,.role-grid{grid-template-columns:1fr}.search{border-radius:18px}.search input{border-radius:12px;border-right:0;border-bottom:1px solid var(--line)}.search select{border-bottom:1px solid var(--line)}.search .btn{border-radius:12px}.section-head{align-items:flex-start;flex-direction:column}.nav{padding:0 18px}main{padding-left:18px;padding-right:18px}}
  </style>
</head>
<body>
  <header class="top"><nav class="nav"><a class="brand" data-view="home"><span class="mark">JF</span>JobFinder</a><div class="menu"><button data-view="jobs">Find Jobs</button><button data-view="companies">Companies</button><button data-view="about">About</button><button data-view="contact">Contact</button><button id="dashboardBtn" data-view="login">Login</button><button class="pill" data-view="login">My Account</button></div><button class="mobile pill" data-view="jobs">Browse</button></nav></header>
  <div id="app"></div>
  <div id="toast" class="toast"></div>
  <script>
    const jobs=[
      {id:1,title:'Laravel Developer',company:'Nexora Technologies',category:'IT',location:'Colombo',type:'Full-time',salary:'Rs. 180,000 - 300,000',desc:'Build Laravel dashboards, APIs, and admin workflows for local business clients.',req:'Laravel, PHP, MySQL, Git, REST APIs and practical debugging skills.'},
      {id:2,title:'Banking Trainee',company:'LakBank Finance',category:'Banking',location:'Colombo',type:'Full-time',salary:'Rs. 75,000 - 95,000',desc:'Join a structured banking trainee programme with branch and operations exposure.',req:'Passed A/L or diploma, communication, numeracy and customer handling skills.'},
      {id:3,title:'Accounts Assistant',company:'Ceylon Retail Group',category:'Finance',location:'Gampaha',type:'Full-time',salary:'Rs. 85,000 - 130,000',desc:'Support daily accounting work for a growing retail finance department.',req:'AAT part qualified, Excel skills, VAT basics and attention to detail.'},
      {id:4,title:'Digital Marketing Executive',company:'Bright Ads Digital',category:'Marketing',location:'Remote',type:'Hybrid',salary:'Rs. 120,000 - 180,000',desc:'Plan social media, paid campaigns and content calendars for Sri Lankan brands.',req:'Meta Ads, Google Ads basics, copywriting and campaign reporting.'},
      {id:5,title:'QA Engineer',company:'Nexora Technologies',category:'IT',location:'Kandy',type:'Full-time',salary:'Rs. 140,000 - 220,000',desc:'Test web applications and help product teams release with confidence.',req:'Manual testing, API testing, SQL basics, Jira and clear bug reporting.'},
      {id:6,title:'Sales Executive',company:'Ceylon Retail Group',category:'Sales',location:'Kurunegala',type:'Full-time',salary:'Rs. 90,000 + commission',desc:'Grow dealer relationships across the North Western Province.',req:'Bike license, Sinhala communication, sales confidence and reporting skills.'},
      {id:7,title:'Graphic Designer',company:'Bright Ads Digital',category:'Creative',location:'Colombo',type:'Part-time',salary:'Rs. 80,000 - 120,000',desc:'Design social creatives, banners and campaign visuals for brand accounts.',req:'Photoshop, Illustrator or Figma, layout sense and portfolio samples.'},
      {id:8,title:'Customer Support Executive',company:'LakBank Finance',category:'Customer Service',location:'Kandy',type:'Full-time',salary:'Rs. 80,000 - 115,000',desc:'Support customers through phone, email and internal ticketing tools.',req:'Clear Sinhala and English, patience, computer literacy and shift flexibility.'},
      {id:9,title:'Data Entry Operator',company:'Nexora Technologies',category:'Administration',location:'Matara',type:'Contract',salary:'Rs. 65,000 - 85,000',desc:'Enter, clean and verify product and customer data.',req:'Fast typing, Excel basics, accuracy and ability to follow processes.'}
    ];
    const store={get(k,d){try{return JSON.parse(localStorage.getItem('jf_'+k))??d}catch{return d}},set(k,v){localStorage.setItem('jf_'+k,JSON.stringify(v))}};
    let role=store.get('role',null),saved=store.get('saved',[]),applications=store.get('applications',[]);
    const app=document.querySelector('#app');
    const toast=m=>{const t=document.querySelector('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};
    const jobCard=j=>`<article class="card job"><div class="job-head"><div class="logo">${j.company.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div><h3>${j.title}</h3><div class="company">${j.company}</div></div></div><div class="tags"><span class="tag">${j.location}</span><span class="tag green">${j.type}</span><span class="tag peach">${j.category}</span></div><p class="muted">${j.desc}</p><div class="price">${j.salary}</div><div class="actions"><button class="btn" data-job="${j.id}">View job</button><button class="btn secondary" data-save="${j.id}">${saved.includes(j.id)?'Saved ✓':'Save'}</button></div></article>`;
    function shell(content){app.innerHTML=`<main>${content}</main><footer class="footer"><div class="footer-inner"><span>© 2026 JobFinder.lk</span><span>Jobs · Companies · Career Advice · Privacy</span></div></footer>`;bind()}
    function home(){app.innerHTML=`<section class="hero"><div class="hero-inner"><h1>Find trusted jobs across Sri Lanka ✦</h1><p>Search verified opportunities from local employers and build your career.</p><form class="search" id="heroSearch"><input id="q" placeholder="Laravel, Banking, Sales, Accounts"><select id="loc"><option value="">All locations</option>${[...new Set(jobs.map(j=>j.location))].map(x=>`<option>${x}</option>`).join('')}</select><button class="btn">Search jobs</button></form></div></section><main><div class="grid g4"><div class="card stat"><strong>${jobs.length}+</strong><span class="muted">Active jobs</span></div><div class="card stat"><strong>4</strong><span class="muted">Verified companies</span></div><div class="card stat"><strong>8</strong><span class="muted">Job categories</span></div><div class="card stat"><strong>Islandwide</strong><span class="muted">Coverage</span></div></div><br><div class="section-head"><div><h2>Recommended jobs</h2><div class="muted">Fresh roles from verified employers, ready for applications.</div></div><button class="btn secondary" data-view="jobs">View all jobs</button></div><div class="chips">${['Software','Banking','Marketing','Finance','Remote'].map(x=>`<button class="chip" data-search="${x}">${x}</button>`).join('')}</div><div class="grid g3">${jobs.slice(0,6).map(jobCard).join('')}</div></main><footer class="footer"><div class="footer-inner"><span>© 2026 JobFinder.lk</span><span>Connecting talent with opportunity</span></div></footer>`;bind();document.querySelector('#heroSearch').onsubmit=e=>{e.preventDefault();jobsView(document.querySelector('#q').value,document.querySelector('#loc').value)}}
    function jobsView(q='',loc=''){const filtered=jobs.filter(j=>(!q||Object.values(j).join(' ').toLowerCase().includes(q.toLowerCase()))&&(!loc||j.location===loc));shell(`<div class="section-head"><div><h2>Find Jobs</h2><div class="muted">${filtered.length} matching opportunities</div></div></div><form class="card search" id="filter"><input id="fq" value="${q}" placeholder="Job title, company or category"><select id="fl"><option value="">All locations</option>${[...new Set(jobs.map(j=>j.location))].map(x=>`<option ${x===loc?'selected':''}>${x}</option>`).join('')}</select><button class="btn">Filter</button></form><br><div class="grid g3">${filtered.length?filtered.map(jobCard).join(''):'<div class="card empty">No jobs found. Try another keyword.</div>'}</div>`);document.querySelector('#filter').onsubmit=e=>{e.preventDefault();jobsView(document.querySelector('#fq').value,document.querySelector('#fl').value)}}
    function detail(id){const j=jobs.find(x=>x.id===+id);shell(`<button class="btn ghost" data-view="jobs">← Back to jobs</button><br><br><div class="grid g2"><article class="card"><div class="job-head"><div class="logo">${j.company[0]}</div><div><h2>${j.title}</h2><div class="muted">${j.company} · ${j.location}</div></div></div><br><div class="tags"><span class="tag green">${j.type}</span><span class="tag">${j.category}</span></div><h3>About this role</h3><p>${j.desc}</p><h3>Requirements</h3><p>${j.req}</p><h3>Salary</h3><p class="price">${j.salary}</p></article><aside class="card"><h2>Ready to apply?</h2><p class="muted">Sign in as a Job Seeker to submit your application.</p><button class="btn" data-apply="${j.id}">Apply now</button> <button class="btn secondary" data-save="${j.id}">${saved.includes(j.id)?'Saved ✓':'Save job'}</button></aside></div>`)}
    function login(){shell(`<section class="auth"><div class="section-head"><div><h2>Choose your account type</h2><div class="muted">Continue to your JobFinder account.</div></div></div><div class="role-grid"><button class="role" data-role="seeker"><b>👤 Job Seeker</b><span class="muted">Search, save and apply for jobs.</span></button><button class="role" data-role="employer"><b>🏢 Employer</b><span class="muted">Review jobs and applications.</span></button><button class="role" data-role="admin"><b>🛡️ Administrator</b><span class="muted">Manage portal activity.</span></button></div></section>`)}
    function dashboard(){if(!role)return login();const nav=`<aside class="side"><button class="active">Overview</button><button data-view="jobs">Browse jobs</button><button data-view="home">Home</button><button id="logout">Switch account</button></aside>`;let body='';if(role==='seeker'){body=`<section><div class="section-head"><div><h2>Job Seeker Dashboard</h2><div class="muted">Welcome back, Kasun Perera</div></div></div><div class="grid g3"><div class="card stat"><strong>${applications.length}</strong><span class="muted">Applications</span></div><div class="card stat"><strong>${saved.length}</strong><span class="muted">Saved jobs</span></div><div class="card stat"><strong>100%</strong><span class="muted">Profile complete</span></div></div><br><div class="card table-wrap"><h3>My applications</h3>${applications.length?`<table class="table"><thead><tr><th>Job</th><th>Company</th><th>Status</th></tr></thead><tbody>${applications.map(id=>{const j=jobs.find(x=>x.id===id);return`<tr><td>${j.title}</td><td>${j.company}</td><td><span class="status pending">Submitted</span></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No applications yet. Browse jobs to find your next opportunity.</div>'}</div></section>`}else if(role==='employer'){body=`<section><div class="section-head"><div><h2>Employer Dashboard</h2><div class="muted">Nexora Technologies</div></div><button class="btn" id="postJob">Post a job</button></div><div class="grid g3"><div class="card stat"><strong>3</strong><span class="muted">Active listings</span></div><div class="card stat"><strong>${applications.length+7}</strong><span class="muted">Applications</span></div><div class="card stat"><strong>248</strong><span class="muted">Profile views</span></div></div><br><div class="card table-wrap"><h3>Recent applicants</h3><table class="table"><thead><tr><th>Candidate</th><th>Role</th><th>Status</th></tr></thead><tbody><tr><td>Nimal Perera</td><td>Laravel Developer</td><td><span class="status pending">Review</span></td></tr><tr><td>Shani Silva</td><td>QA Engineer</td><td><span class="status">Shortlisted</span></td></tr></tbody></table></div></section>`}else{body=`<section><div class="section-head"><div><h2>Admin Dashboard</h2><div class="muted">Portal operations overview</div></div></div><div class="grid g4"><div class="card stat"><strong>186</strong><span class="muted">Users</span></div><div class="card stat"><strong>${jobs.length}</strong><span class="muted">Active jobs</span></div><div class="card stat"><strong>${applications.length+34}</strong><span class="muted">Applications</span></div><div class="card stat"><strong>5</strong><span class="muted">Messages</span></div></div><br><div class="card table-wrap"><h3>Recent activity</h3><table class="table"><thead><tr><th>Item</th><th>Owner</th><th>Status</th></tr></thead><tbody><tr><td>Laravel Developer</td><td>Nexora Technologies</td><td><span class="status">Approved</span></td></tr><tr><td>Digital Marketing Executive</td><td>Bright Ads Digital</td><td><span class="status pending">Pending</span></td></tr></tbody></table></div></section>`}shell(`<div class="panel">${nav}${body}</div>`);document.querySelector('#logout').onclick=()=>{role=null;store.set('role',null);login()};const p=document.querySelector('#postJob');if(p)p.onclick=()=>toast('Job posting form opened.')}
    function companies(){shell(`<div class="section-head"><div><h2>Verified Companies</h2><div class="muted">Explore employers hiring across Sri Lanka.</div></div></div><div class="grid g2">${['Nexora Technologies','Ceylon Retail Group','LakBank Finance','Bright Ads Digital'].map((c,i)=>`<div class="card job-head"><div class="logo">${c.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div><h3>${c}</h3><p class="muted">${jobs.filter(j=>j.company===c).length} open positions · Verified employer</p><button class="btn secondary" data-company="${c}">View jobs</button></div></div>`).join('')}</div>`)}
    function about(){shell(`<div class="grid g2"><section class="card"><h2>About JobFinder</h2><p>JobFinder is a Sri Lankan recruitment portal connecting trusted employers with talented job seekers.</p><p class="muted">Discover verified opportunities, manage applications and build stronger teams in one place.</p></section><section class="card"><h2>What you can do</h2><p>Search and filter jobs, view opportunities, save favourites, manage applications, publish vacancies and monitor portal activity.</p></section></div>`)}
    function contact(){shell(`<div class="grid g2"><section><h2>Contact JobFinder</h2><p class="muted">Our team is ready to help employers and job seekers.</p></section><form class="card form" id="contact"><label>Name<input required placeholder="Your name"></label><label>Email<input type="email" required placeholder="you@example.com"></label><label>Message<textarea required placeholder="How can we help?"></textarea></label><button class="btn">Send message</button></form></div>`);document.querySelector('#contact').onsubmit=e=>{e.preventDefault();e.target.reset();toast('Message sent successfully.')}}
    function bind(){document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>route(x.dataset.view));document.querySelectorAll('[data-job]').forEach(x=>x.onclick=()=>detail(x.dataset.job));document.querySelectorAll('[data-save]').forEach(x=>x.onclick=()=>{const id=+x.dataset.save;saved=saved.includes(id)?saved.filter(v=>v!==id):[...saved,id];store.set('saved',saved);toast(saved.includes(id)?'Job saved':'Removed from saved jobs');detail(id)});document.querySelectorAll('[data-apply]').forEach(x=>x.onclick=()=>{const id=+x.dataset.apply;if(role!=='seeker'){toast('Sign in as a Job Seeker first');return login()}if(!applications.includes(id))applications.push(id);store.set('applications',applications);toast('Application submitted successfully');dashboard()});document.querySelectorAll('[data-role]').forEach(x=>x.onclick=()=>{role=x.dataset.role;store.set('role',role);toast(`${x.textContent.trim()} selected`);dashboard()});document.querySelectorAll('[data-search]').forEach(x=>x.onclick=()=>jobsView(x.dataset.search));document.querySelectorAll('[data-company]').forEach(x=>x.onclick=()=>jobsView(x.dataset.company))}
    function route(v){({home,jobs:jobsView,login,dashboard,companies,about,contact}[v]||home)()}
    document.querySelector('#dashboardBtn').textContent=role?'Dashboard':'Login';document.querySelector('#dashboardBtn').dataset.view=role?'dashboard':'login';home();
  </script>
</body>
</html>
